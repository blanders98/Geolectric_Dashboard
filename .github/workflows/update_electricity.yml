name: Weekly Electricity Data Update

on:
  schedule:
    # Every Tuesday at 1am UTC (Monday 10pm Central)
    - cron: '0 1 * * 2'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-electricity:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run pipeline (full reload)
        env:
          EIA_API_KEY: ${{ secrets.EIA_API_KEY }}
          DUCKDB_MEMORY_LIMIT: '3GB'
          DUCKDB_THREADS: '2'
        run: python -m pipeline.flows.electricity

      - name: Commit and push updated data
        run: |
          git config --global user.name  'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
          git add docs/data/
          git diff --staged --quiet || git commit -m "data: weekly electricity update $(date -u +%Y-%m-%d)"
          git push
